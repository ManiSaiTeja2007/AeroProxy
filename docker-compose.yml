version: '3.8'

services:
  aeroproxy-1:
    build: .
    container_name: aeroproxy-1
    ports:
      - "8080:8080"
      - "9090:9090"
      - "7946:7946/tcp"
      - "7946:7946/udp"
    environment:
      - NODE_NAME=aeroproxy-1
      - BIND_ADDR=0.0.0.0
      - CLUSTER_JOIN_ADDRESS=
    volumes:
      - ./config.yaml:/config.yaml
    networks:
      - aeroproxy-net
    restart: always

  aeroproxy-2:
    build: .
    container_name: aeroproxy-2
    ports:
      - "8081:8080"
      - "9091:9090"
      - "7947:7946/tcp"
      - "7947:7946/udp"
    environment:
      - NODE_NAME=aeroproxy-2
      - BIND_ADDR=0.0.0.0
      - CLUSTER_JOIN_ADDRESS=aeroproxy-1:7946
    volumes:
      - ./config.yaml:/config.yaml
    networks:
      - aeroproxy-net
    depends_on:
      - aeroproxy-1
    restart: always

networks:
  aeroproxy-net:
    driver: bridge
