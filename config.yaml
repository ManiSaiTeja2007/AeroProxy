log_level: "info"

server:
  port: ":8080"
  backends:
    - "http://localhost:8081"
    - "http://localhost:8082"
    - "http://localhost:8083"

ratelimit:
  rate: 5.0
  capacity: 10.0

encryption:
  # WARNING: Production keys MUST be overridden via ENCRYPTION_KEY environment variable.
  key: "0123456789abcdef0123456789abcdef"

cluster:
  node_name: "aeroproxy-node-1"
  bind_addr: "0.0.0.0"
  bind_port: 7946
  join_address: ""
